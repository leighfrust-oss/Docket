<script>(function(){try{var t=localStorage.getItem('docket-theme');if(t==='dark'||t==='light')document.documentElement.setAttribute('data-theme',t)}catch(e){}})()</script><script>
/* Docket look: accent colour and picture theme, applied before first paint */
window.DKL=(function(){var KEY='docket-look',TOK=['--ac','--acd','--acl','--acs','--bg','--br','--br2','--hov','--seg','--inp','--bgimg','--ovl'],mem=null;
function load(){try{var s=localStorage.getItem(KEY);if(s)return JSON.parse(s)}catch(e){}return mem}
function save(o){mem=o;try{if(o)localStorage.setItem(KEY,JSON.stringify(o));else localStorage.removeItem(KEY);return true}catch(e){return false}}
function h2r(h,s,l){h/=360;var a=s*Math.min(l,1-l);function f(n){var k=(n+h*12)%12;return l-a*Math.max(-1,Math.min(k-3,9-k,1))}return[f(0),f(8),f(4)]}
function hex2hsl(x){var m=/^#?([0-9a-f]{6})$/i.exec(x||'');if(!m)return null;var n=parseInt(m[1],16),r=(n>>16&255)/255,g=(n>>8&255)/255,b=(n&255)/255,mx=Math.max(r,g,b),mn=Math.min(r,g,b),l=(mx+mn)/2,d=mx-mn,h=0,s=0;if(d){s=d/(1-Math.abs(2*l-1));if(mx===r)h=(g-b)/d+(g<b?6:0);else if(mx===g)h=(b-r)/d+2;else h=(r-g)/d+4;h*=60}return{h:h,s:s,l:l}}
function lum(c){var k=[.2126,.7152,.0722];return c.reduce(function(a,v,i){v=v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4);return a+v*k[i]},0)}
function wc(h,s,l){return 1.05/(lum(h2r(h,s,l))+.05)}
function hs(h,s,l){return'hsl('+Math.round(h)+' '+(s*100).toFixed(1)+'% '+(l*100).toFixed(1)+'%)'}
function r2h(r,g,b){return'#'+[r,g,b].map(function(v){return('0'+Math.round(Math.max(0,Math.min(255,v))).toString(16)).slice(-2)}).join('')}
function derive(hex,dark){var c=hex2hsl(hex);if(!c)return{};var h=c.h,s=Math.max(.3,Math.min(c.s,.85)),ts=Math.min(.24,s*.28),l=dark?.55:.46;while(l>.2&&wc(h,s,l)<4.5)l-=.01;var t={};
t['--ac']=hs(h,s,l);t['--acd']=dark?hs(h,s,Math.min(.62,l+.05)):hs(h,s,Math.max(.16,l-.08));t['--acl']=dark?hs(h,Math.min(s,.9),.76):hs(h,s,Math.max(.2,l-.04));t['--acs']=dark?hs(h,s*.5,.17):hs(h,s*.75,.95);
if(dark){t['--bg']=hs(h,ts*1.1,.075);t['--br']=hs(h,ts*.9,.165);t['--br2']=hs(h,ts*.8,.24);t['--hov']=hs(h,ts,.13);t['--seg']=hs(h,ts,.145);t['--inp']=hs(h,ts*1.1,.09);t['--card']=hs(h,ts,.105)}
else{t['--bg']=hs(h,ts,.97);t['--br']=hs(h,ts*.9,.915);t['--br2']=hs(h,ts*.8,.84);t['--hov']=hs(h,ts,.955);t['--seg']=hs(h,ts*1.1,.93)}return t}
function isDark(){var a=document.documentElement.getAttribute('data-theme');return a==='dark'||(!a&&matchMedia('(prefers-color-scheme: dark)').matches)}
function apply(){var R=document.documentElement.style,L=load();TOK.concat(['--card']).forEach(function(t){R.removeProperty(t)});if(!L)return;
if(L.accent&&hex2hsl(L.accent)){var t=derive(L.accent,isDark());for(var k in t)R.setProperty(k,t[k])}
if(L.img&&L.bg){R.setProperty('--bgimg','url("'+L.img+'")');R.setProperty('--ovl','color-mix(in srgb,var(--bg) '+(L.dim||88)+'%,transparent)')}}
function set(p){var L=Object.assign({},load()||{},p);Object.keys(L).forEach(function(k){if(L[k]===null||L[k]===undefined)delete L[k]});if(!L.img){delete L.bg;delete L.pal;delete L.dim}if(!L.accent&&!L.img)L=null;var ok=save(L);apply();return ok}
function reset(){save(null);apply()}
function palette(d){var bins=[],i,tr=0,tg=0,tb=0,tn=0;for(i=0;i<24;i++)bins.push({w:0,r:0,g:0,b:0});
for(i=0;i<d.length;i+=4){if(d[i+3]<128)continue;var r=d[i],g=d[i+1],b=d[i+2];tr+=r;tg+=g;tb+=b;tn++;var mx=Math.max(r,g,b),mn=Math.min(r,g,b),l=(mx+mn)/510;if(l<.1||l>.92)continue;var dd=mx-mn;if(!dd)continue;var s=dd/255/(1-Math.abs(2*l-1)+1e-6);if(s<.18)continue;var h;if(mx===r)h=(g-b)/dd+(g<b?6:0);else if(mx===g)h=(b-r)/dd+2;else h=(r-g)/dd+4;h*=60;var wt=Math.min(s,1)*(1-Math.abs(2*l-1))+.02,B=bins[Math.floor(h/15)%24];B.w+=wt;B.r+=r*wt;B.g+=g*wt;B.b+=b*wt}
var arr=[];bins.forEach(function(B,i){if(B.w>0)arr.push({i:i,w:B.w,hex:r2h(B.r/B.w,B.g/B.w,B.b/B.w)})});arr.sort(function(a,b){return b.w-a.w});var out=[],used=[];
arr.forEach(function(x){if(out.length>=5)return;if(used.every(function(u){var dd=Math.abs(u-x.i);return Math.min(dd,24-dd)>=2})){out.push(x.hex);used.push(x.i)}});
if(!out.length)out.push(tn?r2h(tr/tn,tg/tn,tb/tn):'#475569');return out}
return{load:load,set:set,reset:reset,apply:apply,palette:palette};})();
try{DKL.apply()}catch(e){}
</script>

/* Docket: quiet, document-first. Light by default, dark on request or when Windows is dark. */
:root{--bg:#f7f8fa;--card:#ffffff;--tx:#161b25;--mu:#6b7280;--br:#e8ebf0;--br2:#d5dae2;--ac:#3b5bdb;--acd:#2f49b3;--acl:#3450c9;--acs:#eef1fd;--hov:#f3f5f8;--seg:#eceff4;--inp:#ffffff;
--s-slate:#64748b;--s-blue:#2563eb;--s-amber:#b45309;--s-green:#15803d;--s-red:#c9372c;--s-violet:#7c3aed;--s-teal:#0f766e;--s-gray:#98a2b3;
--sh2:0 12px 32px rgba(16,24,40,.14);--ov:rgba(16,24,40,.4);color-scheme:light;--wa:var(--s-amber);--er:var(--s-red);--ok:var(--s-green);
--ui:"Inter UI","Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0f1218;--card:#161a22;--tx:#e8ebf1;--mu:#98a1b0;--br:#242a35;--br2:#333b49;--ac:#4d6de3;--acd:#6483ee;--acl:#9db2ff;--acs:#1b2441;--hov:#1b212b;--seg:#1d232d;--inp:#11151c;
--s-slate:#9aa4b5;--s-blue:#82a6ff;--s-amber:#f0b04d;--s-green:#52c78f;--s-red:#f2776e;--s-violet:#b9a0ff;--s-teal:#47d1a6;--s-gray:#6b7385;
--sh2:0 14px 36px rgba(0,0,0,.55);--ov:rgba(0,0,0,.6);color-scheme:dark;}}
:root[data-theme="dark"]{--bg:#0f1218;--card:#161a22;--tx:#e8ebf1;--mu:#98a1b0;--br:#242a35;--br2:#333b49;--ac:#4d6de3;--acd:#6483ee;--acl:#9db2ff;--acs:#1b2441;--hov:#1b212b;--seg:#1d232d;--inp:#11151c;
--s-slate:#9aa4b5;--s-blue:#82a6ff;--s-amber:#f0b04d;--s-green:#52c78f;--s-red:#f2776e;--s-violet:#b9a0ff;--s-teal:#47d1a6;--s-gray:#6b7385;
--sh2:0 14px 36px rgba(0,0,0,.55);--ov:rgba(0,0,0,.6);color-scheme:dark;}
*{box-sizing:border-box;scrollbar-width:thin;scrollbar-color:var(--br2) transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
body{margin:0;color:var(--tx);font:14.5px/1.55 var(--ui);background:var(--bg);-webkit-font-smoothing:antialiased;font-feature-settings:"cv11"}
.w{max-width:1000px;margin:0 auto;padding:22px 22px 48px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
h1{display:flex;align-items:center;gap:10px;font:600 18px/1 var(--ui);letter-spacing:-.015em;margin:0}h1 svg{flex:none}
.ib{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:9px;border:0;background:transparent;color:var(--mu);cursor:pointer}
.ib:hover{background:var(--hov);color:var(--tx)}
h2{font:600 14px/1.35 var(--ui);color:var(--tx);margin:0 0 10px}
nav{display:flex;gap:2px;overflow-x:auto;overflow-y:hidden;margin-bottom:24px;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{white-space:nowrap;font:500 13.5px var(--ui);background:transparent;border:0;color:var(--mu);padding:7px 13px;cursor:pointer;border-radius:8px}
nav button:hover{color:var(--tx);background:var(--hov)}
nav button.on{color:var(--tx);background:var(--seg);font-weight:600}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:16px}
.c{background:var(--card);border:1px solid var(--br);border-radius:12px;padding:16px 18px;margin-bottom:12px}
.g .c{margin:0}
#v>br{display:none}
.n{font:500 28px/1.15 var(--ui);font-variant-numeric:tabular-nums;color:var(--k,var(--tx));letter-spacing:-.02em;margin-bottom:2px}
.mu{color:var(--mu);font-size:13px}
.bar{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
input,select,textarea{width:100%;padding:8px 11px;border:1px solid var(--br2);border-radius:8px;background:var(--inp);color:var(--tx);font:inherit}
input::placeholder,textarea::placeholder{color:var(--mu);opacity:.75}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--ac);box-shadow:0 0 0 3px color-mix(in srgb,var(--ac) 22%,transparent)}
input[type=checkbox]{width:auto;accent-color:var(--ac)}
.b{border:1px solid var(--ac);background:var(--ac);color:#fff;padding:7px 14px;border-radius:8px;cursor:pointer;white-space:nowrap;font:500 13.5px var(--ui)}
.b:hover{background:var(--acd);border-color:var(--acd)}
.b.s{background:transparent;color:var(--tx);border-color:var(--br2)}.b.s:hover{background:var(--hov)}
.b:focus-visible,nav button:focus-visible,.dc:focus-visible,.sh:focus-visible,.ib:focus-visible,.lk:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.b:disabled{opacity:.45;cursor:default}
.tw{overflow-x:auto;overflow-y:hidden;background:var(--card);border:1px solid var(--br);border-radius:12px}
table{width:100%;border-collapse:collapse}
th,td{padding:11px 14px;text-align:left;border-bottom:1px solid var(--br);vertical-align:top}
tr:last-child td{border-bottom:0}
th{font:500 12px var(--ui);color:var(--mu);white-space:nowrap}
tr:hover td{background:var(--hov)}
.t{display:inline-block;padding:1px 9px;border-radius:99px;font-size:12px;background:var(--hov);border:1px solid var(--br)}
.er{color:var(--er)}.wa{color:var(--wa)}.ok{color:var(--ok)}
.dc{text-align:left;cursor:pointer;font:inherit;color:var(--tx)}.dc *{pointer-events:none}
.c.dc:hover{border-color:var(--br2);background:var(--hov)}
.tg{background:none;border:0;padding:0;text-align:left;cursor:pointer;flex:1;min-width:140px}
.lk,a{color:var(--acl);text-decoration:none}
.lk{background:none;border:0;cursor:pointer;font:inherit;padding:0;text-align:left}
.lk:hover,a:hover{color:var(--tx)}
.th{width:40px;height:40px;object-fit:cover;border-radius:8px}
li{margin:4px 0}ul{padding-left:18px;margin:0}
dialog{border:0;border-radius:16px;background:var(--card);color:var(--tx);width:min(480px,92vw);padding:22px;box-shadow:var(--sh2),0 0 0 1px var(--br)}
dialog::backdrop{background:var(--ov);backdrop-filter:blur(2px)}
label{display:block;margin:12px 0 4px;font:500 12.5px var(--ui);color:var(--mu)}
details summary{cursor:pointer}
.hero{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;margin:0 0 18px;flex-wrap:wrap}
.hello{font-size:24px;font-weight:600;letter-spacing:-.02em;line-height:1.25}
.mono{font:13px var(--ui);color:var(--mu)}
.mono.on{color:var(--mu);display:flex;align-items:center;gap:7px}.mono.on:before{content:"";width:7px;height:7px;border-radius:50%;background:var(--ok)}
.gs{margin-bottom:20px;padding:11px 14px;font-size:14px;border-radius:10px}
.rs{display:flex;gap:12px;width:100%;text-align:left;background:transparent;border:0;border-bottom:1px solid var(--br);color:var(--tx);padding:10px 6px;cursor:pointer;font:inherit}
.rs:hover{background:var(--hov)}.rs *{pointer-events:none}
.tag{font:500 11.5px var(--ui);color:var(--acl);background:var(--acs);border-radius:99px;padding:2px 9px;align-self:flex-start;white-space:nowrap}
.sec{margin-bottom:28px}
.sh{display:flex;justify-content:space-between;align-items:center;width:100%;background:transparent;border:0;padding:0 2px;margin-bottom:10px;cursor:pointer;color:var(--tx);font:600 15px var(--ui);letter-spacing:-.01em}
.sh *{pointer-events:none}.sh .mu{font:500 13px var(--ui);color:var(--mu)}.sh:hover .mu{color:var(--tx)}
/* status board */
#st .snav{display:inline-flex;gap:2px;margin-bottom:18px;overflow-x:auto;overflow-y:hidden;max-width:100%;background:var(--seg);border-radius:10px;padding:3px;scrollbar-width:none}
#st .snav button{font:500 13px var(--ui);background:transparent;border:0;color:var(--mu);padding:6px 14px;border-radius:8px;cursor:pointer;white-space:nowrap}
#st .snav button:hover{color:var(--tx)}
#st .snav button.on{color:var(--tx);background:var(--card);font-weight:600}
#st .bd{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;align-items:start}
#st .ch{font:600 13px var(--ui);color:var(--c);padding:0 2px 8px;margin-bottom:8px;display:flex;justify-content:space-between;border-bottom:2px solid var(--c)}
#st .tk{background:var(--card);border:1px solid var(--br);border-radius:12px;padding:12px 14px;margin-bottom:10px}
#st .tk b{display:block;font-weight:600}
#st .row{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:8px}

 const two=()=>{const a=pd($$('#dc').value),n=parseInt($$('#dn').value,10),u=$$('#du').value,o=$$('#dr2');if(!a||isNaN(n))return o.textContent='';let r;if(u==='d')r=new Date(a.getFullYear(),a.getMonth(),a.getDate()+n);else if(u==='w')r=new Date(a.getFullYear(),a.getMonth(),a.getDate()+n*7);else if(u==='m')r=new Date(a.getFullYear(),a.getMonth()+n,a.getDate());else r=addBiz(a,n);o.innerHTML=dl(r)+`<br><span class="mu">${kf(r)}</span>`};

 Object.keys(f).forEach(k=>['1','2'].forEach(n=>$$('#'+k+n).oninput=()=>{const a=g(k+'1'),b=g(k+'2');o(k+'r',isNaN(a)||isNaN(b)?'':f[k](a,b))}));

 const calc=()=>{const v=num($$('#uv').value),f=$$('#uf').value,t=$$('#ut').value,d=U[uc];if(isNaN(v))return $$('#ur').textContent='';const cv=(x,a,b)=>d.t?tconv(x,a,b):x*d.u[a]/d.u[b];$$('#ur').textContent=fnum(cv(v,f,t),8)+' '+t;$$('#ua').innerHTML=Object.keys(d.u).filter(u=>u!==f).map(u=>fnum(cv(v,f,u),6)+' '+u).join(' · ')};

function textBind(){const x=$$('#tx'),c=$$('#tc');const st=()=>{TX=x.value;const t=x.value,w=(t.match(/\S+/g)||[]).length;c.textContent=`${w} words · ${t.length} characters · ${t.replace(/\s/g,'').length} without spaces · ${(t.match(/[.!?]+(\s|$)/g)||[]).length} sentences · ${t.split(/\n\s*\n/).filter(s=>s.trim()).length} paragraphs · about ${Math.max(w?1:0,Math.round(w/200))} min read`};
 const A={up:s=>s.toUpperCase(),lo:s=>s.toLowerCase(),ti:s=>s.toLowerCase().replace(/(^|[\s(\-])([a-z])/g,(m,a,b)=>a+b.toUpperCase()),se:s=>s.toLowerCase().replace(/(^\s*|[.!?]\s+)([a-z])/g,(m,a,b)=>a+b.toUpperCase()),sp:s=>s.replace(/[ \t]+/g,' ').replace(/ *\n */g,'\n').replace(/\n{3,}/g,'\n\n').trim(),so:s=>s.split('\n').sort((a,b)=>a.localeCompare(b)).join('\n'),du:s=>[...new Set(s.split('\n'))].join('\n'),cl:()=>''};
 x.oninput=st;document.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{const a=b.dataset.a;if(a==='cp')return copy(x.value);x.value=A[a](x.value);st()});st()}

const SUN='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M5.6 18.4L7 17M17 7l1.4-1.4"/></svg>',MOON='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z"/></svg>';
